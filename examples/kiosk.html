<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR Upload Kiosk</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; gap: 24px; padding: 24px;
         background: #f5f5f4; font-family: ui-sans-serif, system-ui, sans-serif; color: #1c1917; }
  #result { font-size: 14px; color: #57534e; word-break: break-all; max-width: 420px; text-align: center; }
</style>
</head>
<body>
  <div>
    <div id="qr"></div>
    <p id="result"></p>
  </div>
  <!-- Built SDK: run `npm run build` first. -->
  <script src="../dist/qr-upload.global.js"></script>
  <script>
    // Local demo only: kiosk.html?api=http://localhost:3088&key=YOUR_API_KEY
    // In production create sessions on your backend and pass `session: () => fetch(...)` instead.
    const params = new URLSearchParams(location.search);
    QrUpload.mountQrUpload("#qr", {
      baseUrl: params.get("api") || "http://localhost:3000",
      apiKey: params.get("key"),
      sessionOptions: { title: "Send a photo to this screen", metadata: { kiosk: "demo" } },
      onComplete(file) {
        document.getElementById("result").textContent = file.url;
      },
    });
  </script>
</body>
</html>
